# Runs the tests on every pull request to main and every push to main. It reads the repo and nothing else:
# no secrets, no deploy, no writes. tests/ci-workflow.test.mjs reads this file and holds it to that.

name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0
      - run: node --test tests/*.test.mjs
